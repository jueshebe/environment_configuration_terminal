set -g default-terminal "screen-256color"


set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix


#create panes
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

#reload conf file
unbind r
bind r source-file ~/.tmux.conf; display-message ".tmux.conf loaded"

#move windows
bind-key -n S-Left swap-window -t -1 \; select-window -t -1
bind-key -n S-Right swap-window -t +1 \; select-window -t +1


# change pane size
bind -r j resize-pane -D 2
bind -r k resize-pane -U 2
bind -r l resize-pane -R 2
bind -r h resize-pane -L 2

bind -r m resize-pane -Z

#turn on mouse
set -g mouse on

# copy text from terminal as nvim
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"


unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse


# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins

# For navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'christoomey/vim-tmux-navigator'

# Persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @resurrect-strategy-nvim 'session' # nvim sessions


# Theme
#set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
#set -g @themepack 'powerline/default/cyan' # use this theme for tmux
# set -g @themepack 'basic' # use this theme for tmux
set -g @plugin 'dracula/tmux'
set -g @dracula-plugins " "
set -g @dracula-show-left-icon "#h | #S"

# Open files or urls
set -g @plugin 'tmux-plugins/tmux-open'


# Automatically saves sessions for you every 15 minutes. 
# WARNING ALWAYS HAS TO BE THE LAST PLUGING
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on' # enable tmux-continuum functionality
set -g @continuum-boot 'on'
set -g @continuum-save-interval '10'

run '~/.tmux/plugins/tpm/tpm'