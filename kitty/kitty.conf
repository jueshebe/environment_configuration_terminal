# Kitty configuration
#
# This file contains the local overrides used on top of Kitty's defaults.
# The Dracula palette is kept in a separate file so it can be updated or
# replaced independently.

include dracula.conf

font_family family='MesloLGS Nerd Font' postscript_name=MesloLGSNF-Regular
font_size 12.0

cursor_shape underline
enable_audio_bell no
visual_bell_duration 0

initial_window_width 91
initial_window_height 27


allow_remote_control yes


background_image ~/environment_configuration_terminal/kitty/wallpaper.jpg
background_image_layout cscaled
background_image_linear yes
background_opacity 0.5
background_tint 0.9
background_blur 0